name = "shopline-appointment-lite"
keep_vars = true
main = "src/worker.js"
compatibility_date = "2026-11-17"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "appointment-lite"
database_id = "60c39273-7d93-46b3-ba5c-53cd4d91a0e9"
migrations_dir = "migrations"

[vars]
NODE_ENV = "production"
APP_URL = "https://appointment.shoplineapp.vip"
SHOPLINE_CALLBACK_PATH = "/auth/callback"
SHOPLINE_API_VERSION = "v20260301"

SHOPLINE_SCOPES = "read_products,read_store_information,read_content,read_orders,read_location"
SHOPLINE_PARTNER_API_VERSION = "v20220901"
SHOPLINE_SUBSCRIPTION_SPU_KEY = "appointment_lite_pro"
SHOPLINE_SUBSCRIPTION_PACKAGE_ID = "c0ced1537654a66c337cd3af4b820b7eac9dd33c"
SHOPLINE_SUBSCRIPTION_PLAN_NAME = "Appointment Lite Pro"
SHOPLINE_SUBSCRIPTION_PRICE_USD = "5.99"
SHOPLINE_SUBSCRIPTION_TRIAL_DAYS = "7"
SHOPLINE_SUBSCRIPTION_GRACE_HOURS = "24"
SHOPLINE_SUBSCRIPTION_SYNC_MAX_AGE_SECONDS = "120"
SHOPLINE_SUBSCRIPTION_TIMEOUT_MS = "15000"
SHOPLINE_THEME_BLOCK_HANDLE = "appointment-lite"
GOOGLE_CALENDAR_REDIRECT_URI = "https://appointment.shoplineapp.vip/integrations/google/callback"
EMAIL_PROVIDER = "auto"
ALIYUN_DIRECTMAIL_FROM_ALIAS = "Appointment Lite"
ALIYUN_DIRECTMAIL_REPLY_TO = "true"
ALIYUN_DIRECTMAIL_ENDPOINT = "dm.aliyuncs.com"
ALIYUN_DIRECTMAIL_REGION_ID = "cn-hangzhou"
COOKIE_SAME_SITE = "lax"
OPS_HUB_ENABLED = "false"

[triggers]
crons = ["* * * * *"]

[[ratelimits]]
name = "BOOKING_RATE_LIMITER"
namespace_id = "2026111701"

  [ratelimits.simple]
  limit = 10
  period = 60

[[routes]]
pattern = "appointment.shoplineapp.vip"
custom_domain = true
