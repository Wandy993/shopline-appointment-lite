<div class="al-widget"
  data-appointment-lite
  data-shop-id="{{ shop.id }}"
  data-product-id="{{ product.id }}"
  hidden>
  <button type="button" class="al-trigger">Book an appointment</button>
  <div class="al-live" aria-live="polite"></div>
</div>

{{#schema}}
{
  "name": "Appointment Lite",
  "target": "section",
  "templates": ["product"],
  "javascript": ["public/appointment-lite.js"],
  "stylesheet": ["public/appointment-lite.css"],
  "limit": 1,
  "settings": []
}
{{/schema}}
